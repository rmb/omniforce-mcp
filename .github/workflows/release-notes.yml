name: Release notes

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Generate and set release notes from commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          NOTES=$(gh api -X POST "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" --jq '.body')
          gh release edit "$TAG" --notes "$NOTES"
