name: Docker (GHCR)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.http
          push: true
          tags: |
            ghcr.io/rmb/omniforce-mcp:latest
            ghcr.io/rmb/omniforce-mcp:${{ github.event.release.tag_name || github.sha }}
